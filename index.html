<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade İlan Yardımcısı</title>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --panel2:#1c2a3a; --line:#26384c;
    --txt:#e6edf3; --muted:#8aa0b5; --accent:#4c9aff; --accent2:#2f7d32;
    --danger:#c0392b; --chip:#22303f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);}
  header{padding:14px 22px;background:linear-gradient(90deg,#132030,#1b2c40);border-bottom:1px solid var(--line);
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  header .titles h1{margin:0;font-size:19px;}
  header .titles p{margin:4px 0 0;color:var(--muted);font-size:12.5px;max-width:640px;}
  .topctrl{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .btnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .profchip{font-size:12px;background:var(--chip);border:1px solid var(--line);padding:6px 10px;border-radius:20px;color:var(--muted);}
  .profchip b{color:var(--txt);}
  select.lang{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 8px;font-size:12.5px;align-self:stretch;}
  .appbar{max-width:1200px;margin:0 auto;padding:18px 20px 0;display:flex;}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;max-width:1200px;margin:0 auto;align-items:start;}
  @media(max-width:860px){.wrap{grid-template-columns:1fr;}}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .star{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;color:#5b6b7d;}
  .star.on{color:#f0b400;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--accent);letter-spacing:.3px;}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{min-height:120px;resize:vertical;line-height:1.5;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:9px 14px;
    font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);}
  .btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.55;cursor:default;filter:none;}
  .btn.green{background:var(--accent2)} .btn.ghost{background:var(--chip);color:var(--txt);}
  .btn.danger{background:var(--danger)} .btn.sm{padding:6px 10px;font-size:12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .item.dashed{border-style:dashed;background:var(--panel);}
  .item.recent{border-color:#c0563f;background:#2b1e1c;box-shadow:0 0 0 1px rgba(192,86,63,.35) inset;}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .item .name{font-weight:600;font-size:13px;}
  .item .url{color:var(--muted);font-size:11px;word-break:break-all;margin-top:2px;}
  .pill{font-size:11px;background:var(--chip);border:1px solid var(--line);padding:3px 8px;border-radius:20px;color:var(--muted);white-space:nowrap;}
  .tplbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f8f3a;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80%;}
  .toast.show{opacity:1;} .toast.err{background:#b5372b;}
  .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .empty{color:var(--muted);font-size:12px;padding:8px 2px;}
  code{background:#0c141d;padding:1px 5px;border-radius:4px;font-size:12px;}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:sp .7s linear infinite;} @keyframes sp{to{transform:rotate(360deg)}}
  /* profil secim ekrani */
  .pwrap{max-width:640px;margin:40px auto;padding:0 20px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;}
  .pcard h2{margin:0 0 6px;font-size:18px;}
  .pcard .sub{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.5;}
  .plist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;}
  .prow:hover{border-color:var(--accent);}
  .prow.sel{border-color:var(--danger);background:#2a1c22;}
  .prow .pinfo{min-width:0}
  .prow .pname{font-weight:600;font-size:14px;}
  .prow .pname.editable{display:inline-block;}
  .prow .pname.editable:hover{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
  .prow .pmeta{color:var(--muted);font-size:11.5px;margin-top:2px;word-break:break-all;}
  .pcheck{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;display:inline-flex;
    align-items:center;justify-content:center;color:#fff;font-size:12px;flex:0 0 auto;}
  .prow.sel .pcheck{background:var(--danger);border-color:var(--danger);}
  /* modal */
  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;}
  .modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:360px;max-width:90%;}
  .modalBox .modalMsg{font-size:13px;color:var(--txt);margin-bottom:10px;}
  /* sol menu (drawer) */
  .hleft{display:flex;align-items:center;gap:12px;min-width:0;}
  .hamb{background:var(--chip);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    width:38px;height:38px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hamb:hover{border-color:var(--accent);}
  .drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.2s;z-index:150;}
  .drawerOverlay.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;left:0;height:100%;width:290px;max-width:82%;background:var(--panel);
    border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s ease;z-index:151;
    display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.35);}
  .drawer.open{transform:translateX(0);}
  .drawerHead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;
    font-size:15px;font-weight:600;border-bottom:1px solid var(--line);}
  .dclose{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .drawerList{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
  .ditem{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.15s;}
  .ditem:hover{border-color:var(--accent);}
  .ditem.active{border-color:var(--accent);background:#1d3350;}
  .ditem .dn{font-weight:600;font-size:13px;}
  .ditem .dm{color:var(--muted);font-size:11px;margin-top:2px;word-break:break-all;}
  .drawerFoot{padding:12px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1 data-i18n="appTitle">🎮 Trade İlan Yardımcısı</h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="topctrl">
    <div class="btnrow">
      <span class="profchip" id="profChip" style="display:none"></span>
      <button class="btn danger sm" id="btnReset" style="display:none" onclick="resetPage()" data-i18n="resetPage"></button>
    </div>
    <select class="lang" id="langSel" onchange="setLang(this.value)">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="zh">中文</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>

<!-- PROFIL SECIM EKRANI -->
<div id="profileView" style="display:none">
  <div class="pwrap">
    <div class="pcard">
      <h2 data-i18n="profilesTitle"></h2>
      <p class="sub" data-i18n="profilesHint"></p>
      <div class="plist" id="profileList"></div>
      <div class="row" id="profileActions" style="margin-top:4px"></div>
    </div>
  </div>
</div>

<!-- ANA UYGULAMA -->
<div id="appView" style="display:none">
  <div class="appbar">
    <button class="btn ghost sm" onclick="goProfiles()" data-i18n="profilesBtn"></button>
    <button class="btn sm" style="margin-left:auto" onclick="openAllGroups()" data-i18n="openAll"></button>
  </div>
  <div class="wrap">
    <div class="col">
    <!-- SABLON -->
    <section class="card">
      <h2 data-i18n="tplTitle"></h2>
      <div class="tplbar">
        <select id="tplSelect" style="flex:1"></select>
        <button class="btn ghost sm" onclick="newTpl()" data-i18n="newBtn"></button>
        <button class="btn danger sm" onclick="delTpl()" data-i18n="deleteBtn"></button>
      </div>
      <label data-i18n="tplNameLabel"></label>
      <input id="tplName">
      <label data-i18n="tplBodyLabel"></label>
      <textarea id="tplBody"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn green" onclick="saveTpl()" data-i18n="save"></button>
        <button class="btn" onclick="copyActive()" data-i18n="copyClipboard"></button>
      </div>
      <div class="note" data-i18n="tplStored"></div>
    </section>

    <!-- FAVORILER -->
    <section class="card">
      <h2 data-i18n="favTitle"></h2>
      <div class="list" id="favList" style="max-height:38vh"></div>
    </section>
    </div><!-- /col -->

    <!-- GRUPLAR -->
    <section class="card">
      <h2 data-i18n="groupsTitle"></h2>
      <div class="item dashed" style="margin-bottom:14px">
        <div class="name" style="color:var(--accent)" data-i18n="fetchTitle"></div>
        <label data-i18n="profileInputLabel"></label>
        <input id="profInput" placeholder="76561199413804452  •  Sinhon  •  https://steamcommunity.com/id/Sinhon">
        <div class="row" style="margin-top:8px">
          <button class="btn green sm" id="fetchBtn" onclick="fetchGroups()" data-i18n="fetchBtn"></button>
        </div>
        <div class="note" data-i18n="fetchHint"></div>
      </div>
      <label data-i18n="groupNameLabel"></label>
      <input id="grpName">
      <label data-i18n="groupUrlLabel"></label>
      <input id="grpUrl" placeholder="https://steamcommunity.com/groups/...">
      <div class="row" style="margin-top:10px">
        <button class="btn sm green" onclick="addGroup()" data-i18n="addManual"></button>
      </div>
      <div class="list" id="groupList"></div>
      <div class="note" data-i18n="usage"></div>
    </section>
  </div>
</div>

<div class="modalOverlay" id="modal">
  <div class="modalBox">
    <div class="modalMsg" id="modalMsg"></div>
    <input id="modalInput" autocomplete="off">
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn ghost sm" id="modalCancel"></button>
      <button class="btn green sm" id="modalOk"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

function fmtLast(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'. '+p(d.getHours())+':'+p(d.getMinutes()); }

const DEFAULT_TPL =
`Trading my playskin for a knife. New to trade. Send fair trade offers.  Fast reply

🎮 Glock-18 | Nuclear Garden FN - Mid Pattern 56$

https://steamcommunity.com/tradeoffer/new/?partner=1453538724&token=AOmvaWxW`;

/* ---------------- durum ---------------- */
const LS='tp_state_v2';
let state={lang:'tr',profiles:[]};
let activeId=null; // oturum bazli, kapatinca profil ekranindan baslar
let pendingCheck=null; // az once acilan grup (odak gelince gercek paylasim kontrolu)

function uid(){return Math.random().toString(36).slice(2,9)}
function t(key,vars){
  let s=(I18N[key]&&(I18N[key][state.lang]||I18N[key].tr))||key;
  if(vars)for(const k in vars)s=s.replace('{'+k+'}',vars[k]);
  return s;
}
function persist(){ localStorage.setItem(LS,JSON.stringify(state)); }

/* Electron prompt() desteklemiyor -> kendi giris penceremiz */
function promptModal(msg,def){
  return new Promise(res=>{
    const ov=document.getElementById('modal');
    document.getElementById('modalMsg').textContent=msg;
    const inp=document.getElementById('modalInput'); inp.value=def||'';
    const okB=document.getElementById('modalOk'), caB=document.getElementById('modalCancel');
    okB.textContent=t('ok'); caB.textContent=t('cancel');
    ov.style.display='flex'; setTimeout(()=>{inp.focus();inp.select();},30);
    function done(v){ ov.style.display='none'; okB.onclick=null;caB.onclick=null;inp.onkeydown=null; res(v); }
    okB.onclick=()=>done(inp.value);
    caB.onclick=()=>done(null);
    inp.onkeydown=e=>{ if(e.key==='Enter')done(inp.value); else if(e.key==='Escape')done(null); };
  });
}

function migrateOld(){
  // eski tek-profilli surumden tasima
  const oldT=localStorage.getItem('tp_templates');
  const oldG=localStorage.getItem('tp_groups');
  if(!oldT && !oldG) return;
  let templates=[]; try{templates=JSON.parse(oldT||'[]')}catch(e){}
  let groups=[]; try{groups=JSON.parse(oldG||'[]')}catch(e){}
  if(!templates.length) templates=[{id:uid(),name:'Glock Nuclear Garden',body:DEFAULT_TPL}];
  state.profiles.push({
    id:uid(), name:t('profileDefault')+' 1',
    steamInput:localStorage.getItem('tp_profile')||'',
    templates, activeTplId:localStorage.getItem('tp_active')||templates[0].id,
    groups
  });
  ['tp_templates','tp_groups','tp_profile','tp_active'].forEach(k=>localStorage.removeItem(k));
  persist();
}

function load(){
  const raw=localStorage.getItem(LS);
  if(raw){ try{state=JSON.parse(raw)}catch(e){} }
  if(!state.lang) state.lang='tr';
  if(!Array.isArray(state.profiles)) state.profiles=[];
  if(!state.profiles.length) migrateOld();
  document.getElementById('langSel').value=state.lang;
}
function ap(){ return state.profiles.find(p=>p.id===activeId)||null; }

/* ---------------- dil ---------------- */
function applyI18n(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent=t(el.getAttribute('data-i18n'));
  });
  document.getElementById('profInput').placeholder='76561199413804452  •  Sinhon  •  https://steamcommunity.com/id/Sinhon';
}
function setLang(l){ state.lang=l; persist(); render(); }

/* ---------------- profil ekrani ---------------- */
function render(){
  applyI18n();
  const inApp=!!ap();
  document.getElementById('appView').style.display=inApp?'block':'none';
  document.getElementById('profileView').style.display=inApp?'none':'block';
  document.getElementById('btnReset').style.display=inApp?'inline-flex':'none';
  const chip=document.getElementById('profChip');
  if(inApp){ chip.style.display='inline-block'; chip.innerHTML='<b>'+esc(ap().name)+'</b>'; }
  else chip.style.display='none';
  if(inApp){ renderApp(); startAuto(); } else { renderProfiles(); stopAuto(); }
}
let delMode=false; const delSel=new Set();
function renderProfiles(){
  const box=document.getElementById('profileList'); box.innerHTML='';
  if(!state.profiles.length){ box.innerHTML='<div class="empty">'+esc(t('noProfiles'))+'</div>'; renderProfileActions(); return; }
  state.profiles.forEach(p=>{
    const meta=esc(p.steamInput||'—')+' · '+esc(t('groupsCount',{n:(p.groups||[]).length}));
    const el=document.createElement('div'); el.dataset.id=p.id;
    el.className='prow'+(delMode&&delSel.has(p.id)?' sel':'');
    if(delMode){
      el.innerHTML=`<div style="display:flex;align-items:center;gap:12px;min-width:0">
          <span class="pcheck">${delSel.has(p.id)?'✓':''}</span>
          <div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${meta}</div></div>
        </div>`;
    }else{
      el.title=t('clickToOpen');
      el.innerHTML=`<div class="pinfo">
          <div class="pname editable" data-a="rename" title="${esc(t('renameHint'))}">${esc(p.name)}</div>
          <div class="pmeta">${meta}</div>
        </div>`;
    }
    box.appendChild(el);
  });
  renderProfileActions();
}
function renderProfileActions(){
  const box=document.getElementById('profileActions'); box.innerHTML='';
  if(delMode){
    const n=delSel.size;
    box.innerHTML=`<button class="btn danger" id="paDel" ${n?'':'disabled'}>${esc(t('deleteSelected',{n}))}</button>
      <button class="btn ghost" id="paCancel">${esc(t('cancel'))}</button>`;
    box.querySelector('#paDel').onclick=deleteSelected;
    box.querySelector('#paCancel').onclick=cancelDelMode;
  }else{
    box.innerHTML=`<button class="btn green" id="paNew">${esc(t('newProfile'))}</button>`+
      (state.profiles.length?`<button class="btn danger" id="paDelMode">${esc(t('deleteProfileBtn'))}</button>`:'');
    box.querySelector('#paNew').onclick=createProfile;
    const dm=box.querySelector('#paDelMode'); if(dm) dm.onclick=enterDelMode;
  }
}
function enterDelMode(){ delMode=true; delSel.clear(); renderProfiles(); }
function cancelDelMode(){ delMode=false; delSel.clear(); renderProfiles(); }
function deleteSelected(){
  if(!delSel.size) return;
  if(!confirm(t('confirmDelSelected'))) return;
  state.profiles=state.profiles.filter(p=>!delSel.has(p.id));
  if(delSel.has(activeId)) activeId=null;
  delMode=false; delSel.clear(); persist(); render();
}
document.getElementById('profileList').addEventListener('click',async e=>{
  const row=e.target.closest('.prow'); if(!row)return;
  const id=row.dataset.id; const p=state.profiles.find(x=>x.id===id); if(!p)return;
  if(delMode){ delSel.has(id)?delSel.delete(id):delSel.add(id); renderProfiles(); return; }
  if(e.target.closest('[data-a="rename"]')){
    const n=await promptModal(t('promptProfile'),p.name); if(n!==null){p.name=n.trim()||p.name;persist();renderProfiles();}
    return;
  }
  activeId=id; render();
});
function createProfile(){
  const n=state.profiles.length+1;
  const tpl={id:uid(),name:t('tplDefaultName')+' 1',body:''};
  const p={id:uid(),name:t('profileDefault')+' '+n,steamInput:'',templates:[tpl],activeTplId:tpl.id,groups:[]};
  state.profiles.push(p); persist(); activeId=p.id; delMode=false; delSel.clear(); render();
}
function goProfiles(){ activeId=null; delMode=false; delSel.clear(); render(); }
function resetPage(){
  const p=ap(); if(!p)return;
  if(!confirm(t('confirmReset')))return;
  p.groups=[]; p.steamInput=''; persist(); renderApp(); toast(t('resetDone'));
}

/* ---------------- ana uygulama ---------------- */
function renderApp(){
  const p=ap(); if(!p)return;
  document.getElementById('profInput').value=p.steamInput||'';
  renderTpls(); renderGroups();
}
function renderTpls(){
  const p=ap(); if(!p)return;
  const sel=document.getElementById('tplSelect'); sel.innerHTML='';
  p.templates.forEach(tp=>{
    const o=document.createElement('option');o.value=tp.id;o.textContent=tp.name||'(?)';
    if(tp.id===p.activeTplId)o.selected=true;sel.appendChild(o);
  });
  const tp=p.templates.find(x=>x.id===p.activeTplId);
  document.getElementById('tplName').value=tp?tp.name:'';
  document.getElementById('tplBody').value=tp?tp.body:'';
}
document.getElementById('tplSelect').addEventListener('change',e=>{const p=ap();if(!p)return;p.activeTplId=e.target.value;persist();renderTpls();});
document.getElementById('profInput').addEventListener('input',e=>{const p=ap();if(p){p.steamInput=e.target.value;persist();}});
function newTpl(){const p=ap();if(!p)return;const tp={id:uid(),name:t('tplDefaultName')+' '+(p.templates.length+1),body:''};p.templates.push(tp);p.activeTplId=tp.id;persist();renderTpls();}
function saveTpl(){const p=ap();if(!p)return;const tp=p.templates.find(x=>x.id===p.activeTplId);if(!tp)return;
  tp.name=document.getElementById('tplName').value.trim()||'(?)';tp.body=document.getElementById('tplBody').value;persist();renderTpls();toast(t('saved'));}
function delTpl(){const p=ap();if(!p)return;if(p.templates.length<=1){toast(t('atLeastOne'),true);return;}
  p.templates=p.templates.filter(x=>x.id!==p.activeTplId);p.activeTplId=p.templates[0].id;persist();renderTpls();}
function copyActive(){ doCopy(document.getElementById('tplBody').value); }

          </div>
        </div>
        <span class="pill">#${i+1}</span>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-a="copyopen" data-id="${g.id}">${esc(t('copyOpen'))}</button>
        <button class="btn ghost sm" data-a="open" data-id="${g.id}">${esc(t('openOnly'))}</button>
        <button class="btn ghost sm" data-a="check" data-id="${g.id}" title="${esc(t('checkPost'))}">🔄</button>
        <button class="btn ghost sm" data-a="rename" data-id="${g.id}">${esc(t('renameShort'))}</button>
        <button class="btn danger sm" data-a="del" data-id="${g.id}">${esc(t('deleteBtn'))}</button>
      </div>`;
    box.appendChild(el);
  });
  renderFavs();
}
function renderFavs(){
  const p=ap(); if(!p)return;
  const box=document.getElementById('favList'); if(!box)return; box.innerHTML='';
  const favs=(p.groups||[]).filter(g=>g.fav);
  if(!favs.length){ box.innerHTML='<div class="empty">'+esc(t('favEmpty'))+'</div>'; return; }
  const recentId=mostRecentGroupId(p);
  favs.forEach(g=>{
    const el=document.createElement('div');el.className='item'+(g.id===recentId?' recent':'');
    el.innerHTML=`<div class="name">⭐ ${esc(g.name)}</div>
      ${g.lastPost?`<div class="url" style="color:#6fbf73;margin-top:3px">🕒 ${esc(t('lastActivity'))}: ${fmtLast(g.lastPost)}</div>`:''}
      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-a="copyopen" data-id="${g.id}">${esc(t('copyOpen'))}</button>
        <button class="btn ghost sm" data-a="open" data-id="${g.id}">${esc(t('openOnly'))}</button>
        <button class="star on" data-a="fav" data-id="${g.id}">★</button>
      </div>`;
    box.appendChild(el);
  });
}
function groupAction(a,id){
  const p=ap(); if(!p)return;
  const g=p.groups.find(x=>x.id===id); if(!g)return;
  if(a==='copyopen'){ const ad=document.getElementById('tplBody').value; doCopy(ad); ensureAccountId(p);
    pendingCheck={id:g.id,at:Date.now(),tries:0}; openGroupForPost(g,ad); }
  else if(a==='open'){ ensureAccountId(p); pendingCheck={id:g.id,at:Date.now(),tries:0}; openGroupForPost(g,document.getElementById('tplBody').value); }
  else if(a==='fav'){ g.fav=!g.fav; persist(); renderGroups(); }
  else if(a==='check'){ manualCheck(g); }
  else if(a==='del'){ p.groups=p.groups.filter(x=>x.id!==g.id);persist();renderGroups(); }
  return g;
}
// Grubu dogrudan Yorumlar sayfasinda ac; ilan metnini #tradead= ile gomer (Tampermonkey doldurur)
function commentsUrl(u){ return (u||'').replace(/\/+$/,'')+'/comments'; }
function openGroupForPost(g,ad){
  let url=commentsUrl(g.url);
  if(ad) url+='#tradead='+encodeURIComponent(ad);
  openUrl(url);
}
// Tum gruplarin yorum sayfalarini ayri sekmelerde ac (gonderme yine kullanicida)
function openAllGroups(){
  const p=ap(); if(!p||!p.groups.length) return;
  if(!confirm(t('confirmOpenAll',{n:p.groups.length}))) return;
  const ad=document.getElementById('tplBody').value;
  doCopy(ad); ensureAccountId(p);
  toast(t('openingAll',{n:p.groups.length}));
  p.groups.forEach((g,i)=>{
    setTimeout(()=>{ let url=commentsUrl(g.url); if(ad) url+='#tradead='+encodeURIComponent(ad); openUrl(url); }, i*350);
  });
}

/* ---- gercek paylasim tespiti (Steam yorumlarindan) ---- */
const STEAM_BASE=76561197960265728n;
function accountFromId64(id64){ try{ return (BigInt(id64)-STEAM_BASE).toString(); }catch(e){ return null; } }
function ensureAccountId(p){
  if(p.accountId) return;
  const v=p.steamInput||'';
  let m=v.match(/\/profiles\/(\d{17})/) || v.match(/^(\d{17})$/);
  if(m){ p.steamid64=m[1]; p.accountId=accountFromId64(m[1]); persist(); }
}
// Grubun /comments sayfasindan senin en yeni yorumunun zamanini bul
async function verifyPost(g, sinceMs){
  const p=ap(); if(!p||!p.accountId||!window.api||!window.api.fetchPage) return false;
  const r=await window.api.fetchPage(commentsUrl(g.url));
  if(!r||!r.ok) return false;
  const re=/data-miniprofile="(\d+)"[\s\S]*?data-timestamp="(\d+)"/g;
  let m,best=0;
  while((m=re.exec(r.html))){ if(m[1]===p.accountId){ const ts=(+m[2])*1000; if(ts>best) best=ts; } }
  if(best && (!sinceMs || best>=sinceMs-5*60000)){
    if(g.lastPost!==best){ g.lastPost=best; g.lastPostReal=true; persist(); renderGroups(); }
    return true;
  }
  return false;
}
async function manualCheck(g){
  const p=ap(); if(!p) return;
  ensureAccountId(p);
  if(!p.accountId){ toast(t('needAccount'),true); return; }
  toast(t('checking'));
  const ok=await verifyPost(g,0);
  toast(ok?t('postFound'):t('noPostFound'), !ok);
}
// Kullanici uygulamaya geri dondugunde (odak), az once actigi grubu kontrol et
let verifyingNow=false;
async function maybeVerify(){
  if(verifyingNow||!pendingCheck) return;
  const p=ap(); if(!p){ return; }
  const g=p.groups.find(x=>x.id===pendingCheck.id);
  if(!g){ pendingCheck=null; return; }
  if(Date.now()-pendingCheck.at>30*60000){ pendingCheck=null; return; }
  verifyingNow=true;
  pendingCheck.tries=(pendingCheck.tries||0)+1;
  const ok=await verifyPost(g, pendingCheck.at);
  verifyingNow=false;
  if(ok||pendingCheck.tries>=6) pendingCheck=null;
}
window.addEventListener('focus', maybeVerify);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) maybeVerify(); });

/* ---- otomatik guncelleme: her ~8sn'de bir grubu sirayla kontrol et (sadece pencere gorunurken) ---- */
let autoTimer=null, autoIdx=0, autoBusy=false;
function startAuto(){
  if(autoTimer) return;
  autoIdx=0;
  autoTimer=setInterval(autoTick, 8000);
  setTimeout(autoTick, 1500); // acilinca kisa sure sonra basla
}
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }
async function autoTick(){
  if(autoBusy || document.hidden) return;
  const p=ap(); if(!p||!p.groups.length) return;
  ensureAccountId(p);
  if(!p.accountId) return;
  autoBusy=true;
  const g=p.groups[autoIdx % p.groups.length];
  autoIdx++;
  try{ await verifyPost(g, 0); }catch(e){}
  autoBusy=false;
}
// en son paylasim yapilan grubun id'si (vurgulamak icin)
function mostRecentGroupId(p){ let ts=0,id=null; (p&&p.groups||[]).forEach(g=>{ if(g.lastPost&&g.lastPost>ts){ts=g.lastPost;id=g.id;} }); return id; }
document.getElementById('groupList').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-a]'); if(!b)return;
  if(b.dataset.a==='rename'){
    const p=ap(); if(!p)return; const g=p.groups.find(x=>x.id===b.dataset.id); if(!g)return;
    const n=await promptModal(t('promptGroup'),g.name); if(n!==null){g.name=n.trim()||g.name;persist();renderGroups();}
    return;
  }
  groupAction(b.dataset.a,b.dataset.id);
});
document.getElementById('favList').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]'); if(!b)return;
  groupAction(b.dataset.a,b.dataset.id);
});
function addGroup(){
  const p=ap(); if(!p)return;
  const name=document.getElementById('grpName').value.trim();
  const url=document.getElementById('grpUrl').value.trim();
  if(!name||!url){toast(t('needNameUrl'),true);return;}
  p.groups.push({id:uid(),name,url});persist();renderGroups();
  document.getElementById('grpName').value='';document.getElementById('grpUrl').value='';
}

function normUrl(u){return (u||'').replace(/\/+$/,'').toLowerCase();}
function parseGroupsFromHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const map=new Map();
  doc.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href')||'';
    const m=href.match(/steamcommunity\.com\/(groups|gid)\/([^\/\?#"'\s]+)/i);
    if(!m)return;
    const slug=m[2];
    if(/^(home|discussions|members|events|comments|about|search)$/i.test(slug))return;
    const url='https://steamcommunity.com/'+m[1]+'/'+slug;
    const name=(a.textContent||'').trim().replace(/\s+/g,' ');
    const key=normUrl(url); const cur=map.get(key);
    if(!cur || (name && !cur.name)) map.set(key,{name,url});
  });
  return [...map.values()];
}
async function fetchGroups(){
  const p=ap(); if(!p)return;
  const btn=document.getElementById('fetchBtn');
  const input=document.getElementById('profInput').value.trim();
  if(!input){toast(t('needProfile'),true);return;}
  p.steamInput=input; persist();
  btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span> '+esc(t('fetching'));
  try{
    const r=await window.api.fetchGroups(input);
    if(!r.ok){toast(t('errPfx')+(r.error||'?'),true);return;}
    if(r.steamid64){ p.steamid64=r.steamid64; p.accountId=accountFromId64(r.steamid64); }
    const found=parseGroupsFromHtml(r.html);
    if(!found.length){toast(t('noneFound'),true);return;}
    const existing=new Set(p.groups.map(g=>normUrl(g.url)));
    let added=0;
    found.forEach(f=>{const key=normUrl(f.url);if(existing.has(key))return;
      p.groups.push({id:uid(),name:f.name||('Group '+(p.groups.length+1)),url:f.url});existing.add(key);added++;});
    persist();renderGroups();
    toast(added?t('groupsAdded',{n:added,t:found.length}):t('noNew'));
  }catch(e){ toast(t('errPfx')+(e.message||e),true); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

function openUrl(u){ if(window.api) window.api.openExternal(u); else window.open(u,'_blank'); }
function doCopy(text){
  if(window.api){ window.api.copy(text); toast(t('copied')); return; }
  navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(()=>toast('x',true));
}
let tt;function toast(m,err){const el=document.getElementById('toast');el.textContent=m;
  el.classList.toggle('err',!!err);el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),err?2600:1600);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

load(); render();
</script>
